<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Еда в холодильнике — Food in the Fridge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
    background: linear-gradient(135deg, #e8f5e9 0%, #e3f2fd 50%, #fff9c4 100%);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  .food-icon {
    position: fixed;
    font-size: 2rem;
    opacity: 0.2;
    pointer-events: none;
    z-index: 0;
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(10deg); }
  }
/* === BACK BUTTON === */
  .back-button {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    background: linear-gradient(135deg, #ffc107, #ff9800);
    color: #fff;
    text-decoration: none;
    border-radius: 30px;
    font-weight: 700;
    font-size: 1rem;
    box-shadow: 0 4px 15px rgba(255,152,0,0.4);
    transition: all 0.3s ease;
    border: 3px solid #fff;
  }

  .back-button:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 6px 20px rgba(255,152,0,0.5);
  }

  .back-button:active {
    transform: scale(0.98);
  }

  .back-button .arrow {
    font-size: 1.3rem;
    transition: transform 0.3s ease;
  }

  .back-button:hover .arrow {
    transform: translateX(-3px);
  }
  .header {
    text-align: center;
    padding: 30px 20px 20px;
    position: relative;
    z-index: 1;
  }

  .header h1 {
    font-size: clamp(1.8rem, 5vw, 3rem);
    color: #2e7d32;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    margin-bottom: 10px;
  }

  .header .subtitle {
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    color: #1565c0;
    font-weight: 600;
  }

  .header .hint {
    margin-top: 15px;
    font-size: clamp(0.9rem, 2.5vw, 1.2rem);
    color: #555;
    background: rgba(255,255,255,0.8);
    display: inline-block;
    padding: 10px 25px;
    border-radius: 25px;
    border: 3px dashed #4caf50;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 28px;
    padding: 20px 35px 50px;
    max-width: 1400px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .card {
    background: #fff;
    border-radius: 24px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    position: relative;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    border: 4px solid transparent;
  }

  .card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 12px 35px rgba(0,0,0,0.2);
  }

  .card:active {
    transform: scale(0.98);
  }

  .card.active {
    border-color: #ffc107;
    box-shadow: 0 8px 30px rgba(255,193,7,0.4);
  }

  .card-img-wrapper {
    width: 100%;
    aspect-ratio: 16/10;
    overflow: hidden;
    background: linear-gradient(135deg, #f5f5f5, #e0e0e0);
    position: relative;
  }

  .card-img-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }

  .card:hover .card-img-wrapper img {
    transform: scale(1.08);
  }

  .card-russian {
    padding: 16px 20px;
    text-align: center;
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    font-weight: 700;
    color: #333;
    background: linear-gradient(135deg, #e8f5e9, #bbdefb);
    border-top: 3px solid #81c784;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-number {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, #ffc107, #ff9800);
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1rem;
    box-shadow: 0 3px 10px rgba(0,0,0,0.25);
    z-index: 2;
  }

  .card-emoji {
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 2rem;
    z-index: 2;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }

  .info-panel-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    animation: fadeIn 0.3s ease;
  }

  .info-panel-overlay.visible {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .info-panel {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 95%;
    max-width: 550px;
    background: linear-gradient(135deg, #ffffff, #fff9c4);
    border-radius: 28px 28px 0 0;
    padding: 35px 28px 40px;
    z-index: 101;
    box-shadow: 0 -10px 50px rgba(0,0,0,0.3);
    animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    text-align: center;
    border-top: 5px solid #4caf50;
  }

  @keyframes slideUp {
    from { transform: translateX(-50%) translateY(100%); }
    to { transform: translateX(-50%) translateY(0); }
  }

  .info-panel .close-hint {
    font-size: 0.9rem;
    color: #888;
    margin-top: 18px;
  }

  .info-panel .close-hint span {
    display: inline-block;
    width: 32px;
    height: 32px;
    background: #ffeb3b;
    border-radius: 50%;
    line-height: 32px;
    font-weight: bold;
    color: #333;
    margin-left: 8px;
  }

  .info-panel .img-preview {
    width: 140px;
    height: 90px;
    object-fit: cover;
    border-radius: 16px;
    margin: 0 auto 20px;
    display: block;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    border: 3px solid #81c784;
  }

  .info-panel .ru-text {
    font-size: 1.5rem;
    font-weight: 700;
    color: #2e7d32;
    margin-bottom: 12px;
  }

  .info-panel .arrow {
    font-size: 1.8rem;
    color: #ffc107;
    margin-bottom: 10px;
    animation: bounce 1s infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  .info-panel .en-text {
    font-size: 1.8rem;
    font-weight: 800;
    color: #1565c0;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
  }

  .info-panel .transcription {
    font-size: 1.3rem;
    color: #6a1b9a;
    font-weight: 600;
    background: linear-gradient(135deg, #f3e5f5, #e1bee7);
    display: inline-block;
    padding: 8px 24px;
    border-radius: 18px;
    margin-top: 6px;
    border: 2px solid #ce93d8;
  }

  .info-panel .emoji-badge {
    font-size: 2.5rem;
    margin-bottom: 10px;
  }

  @media (max-width: 768px) {
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
      padding: 18px;
    }
    .header { padding: 25px 18px 15px; }
    .info-panel { padding: 28px 22px 32px; }
    .info-panel .en-text { font-size: 1.5rem; }
    .info-panel .ru-text { font-size: 1.3rem; }
    .card-russian { min-height: 50px; padding: 12px 14px; font-size: 0.95rem; }
  }

  @media (max-width: 480px) {
    .grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 14px;
    }
    .card-russian { padding: 10px 10px; font-size: 0.85rem; min-height: 45px; }
    .card-number { width: 30px; height: 30px; font-size: 0.85rem; }
    .card-emoji { font-size: 1.5rem; }
    .info-panel .img-preview { width: 120px; height: 75px; }
  }

  .card[data-theme="green"] .card-russian { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); border-top-color: #66bb6a; }
  .card[data-theme="blue"] .card-russian { background: linear-gradient(135deg, #e3f2fd, #bbdefb); border-top-color: #42a5f5; }
  .card[data-theme="yellow"] .card-russian { background: linear-gradient(135deg, #fff9c4, #fff59d); border-top-color: #ffca28; }
  .card[data-theme="orange"] .card-russian { background: linear-gradient(135deg, #ffe0b2, #ffcc80); border-top-color: #ffa726; }
  .card[data-theme="pink"] .card-russian { background: linear-gradient(135deg, #f8bbd9, #f48fb1); border-top-color: #ec407a; }
  .card[data-theme="purple"] .card-russian { background: linear-gradient(135deg, #e1bee7, #ce93d8); border-top-color: #ab47bc; }
</style>
</head>
<body>
<a href="../index.html" class="back-button">
  <span class="arrow">←</span>
  <span>В главное меню</span>
</a>
<div class="food-icon" style="top:5%;left:3%;animation-delay:0s;">🥛</div>
<div class="food-icon" style="top:15%;right:5%;animation-delay:1s;">🧀</div>
<div class="food-icon" style="top:30%;left:8%;animation-delay:0.5s;">🥚</div>
<div class="food-icon" style="top:50%;right:3%;animation-delay:2s;">🍎</div>
<div class="food-icon" style="top:70%;left:5%;animation-delay:1.5s;">🥕</div>
<div class="food-icon" style="top:80%;right:8%;animation-delay:0.8s;">🍗</div>
<div class="food-icon" style="top:45%;left:2%;animation-delay:2.5s;">🧊</div>
<div class="food-icon" style="top:60%;left:95%;animation-delay:1.2s;"></div>
<div class="food-icon" style="top:90%;left:50%;animation-delay:0.3s;">🍦</div>
<div class="food-icon" style="top:10%;left:50%;animation-delay:3s;">🥦</div>

<div class="header">
  <h1> Еда в холодильнике </h1>
  <div class="subtitle">Food in the Fridge — Учим английский!</div>
  <div class="hint"> Нажми на карточку, чтобы увидеть перевод!</div>
</div>

<div class="grid" id="grid"></div>

<div class="info-panel-overlay" id="overlay"></div>
<div class="info-panel" id="infoPanel" style="display:none;">
  <div class="emoji-badge" id="panelEmoji"></div>
  <img class="img-preview" id="panelImg" src="" alt="">
  <div class="ru-text" id="panelRu"></div>
  <div class="arrow">️</div>
  <div class="en-text" id="panelEn"></div>
  <div class="transcription" id="panelTrans"></div>
  <div class="close-hint">Нажми на пустое место, чтобы закрыть <span>✕</span></div>
</div>

<script>
const foodItems = [
  {
    id: 0,
    ru: "У меня есть молоко в холодильнике",
    en: "I have milk in the fridge",
    trans: "[ай хэв милк ин зэ фридж]",
    emoji: "🥛",
    theme: "blue",
    img: "img1.png"
  },
  {
    id: 1,
    ru: "Я вижу сыр в холодильнике",
    en: "I can see cheese in the fridge",
    trans: "[ай кэн си чиз ин зэ фридж]",
    emoji: "🧀",
    theme: "yellow",
    img: "img2.png"
  },
  {
    id: 2,
    ru: "В холодильнике есть масло",
    en: "There is butter in the fridge",
    trans: "[зэз из батэр ин зэ фридж]",
    emoji: "🧈",
    theme: "yellow",
    img: "img3.png"
  },
  {
    id: 3,
    ru: "Я хочу йогурт из холодильника",
    en: "I want yogurt from the fridge",
    trans: "[ай уонт йогэт фром зэ фридж]",
    emoji: "",
    theme: "pink",
    img: "img4.png"
  },
  {
    id: 4,
    ru: "На верхней полке находятся свежие яйца",
    en: "Fresh eggs are on the top shelf",
    trans: "[фрэш эгз ар он зэ топ шелф]",
    emoji: "",
    theme: "orange",
    img: "img5.png"
  },
  {
    id: 5,
    ru: "Я вижу овощи в холодильнике",
    en: "I can see vegetables in the fridge",
    trans: "[ай кэн си вэджитаблз ин зэ фридж]",
    emoji: "🥕",
    theme: "green",
    img: "img6.png"
  },
  {
    id: 6,
    ru: "В холодильнике есть сок",
    en: "There is juice in the fridge",
    trans: "[зэз из джус ин зэ фридж]",
    emoji: "🧃",
    theme: "orange",
    img: "img7.png"
  },
  {
    id: 7,
    ru: "У меня есть яблоки в холодильнике",
    en: "I have apples in the fridge",
    trans: "[ай хэв эплз ин зэ фридж]",
    emoji: "🍎",
    theme: "green",
    img: "img8.png"
  },
  {
    id: 8,
    ru: "Сегодня у меня на ужин будет мясо с овощами",
    en: "I will have meat with vegetables for dinner today",
    trans: "[ай уил хэв мит уиз вэджитаблз фор динэр тудэй]",
    emoji: "🥩",
    theme: "purple",
    img: "img9.png"
  },
  {
    id: 9,
    ru: "Я вижу рыбу в холодильнике",
    en: "I can see fish in the fridge",
    trans: "[ай кэн си фиш ин зэ фридж]",
    emoji: "🐟",
    theme: "blue",
    img: "img10.png"
  },
  {
    id: 10,
    ru: "В холодильнике есть колбаса",
    en: "There are sausages in the fridge",
    trans: "[зэз ар сосиджиз ин зэ фридж]",
    emoji: "🌭",
    theme: "pink",
    img: "img11.png"
  },
  {
    id: 11,
    ru: "У меня есть мороженое в холодильнике",
    en: "I have ice cream in the fridge",
    trans: "[ай хэв айс крим ин зэ фридж]",
    emoji: "🍦",
    theme: "purple",
    img: "img12.png"
  }
];

const grid = document.getElementById('grid');

foodItems.forEach((item, index) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.theme = item.theme;
  card.dataset.index = index;

  card.innerHTML = `
    <div class="card-number">${index + 1}</div>
    <div class="card-emoji">${item.emoji}</div>
    <div class="card-img-wrapper">
      <img src="${item.img}" alt="${item.ru}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
      <div class="placeholder-img" style="display:none;font-size:4rem;align-items:center;justify-content:center;background:linear-gradient(135deg,#e8f5e9,#e3f2fd);width:100%;height:100%;">${item.emoji}</div>
    </div>
    <div class="card-russian">${item.ru}</div>
  `;

  card.addEventListener('click', function(e) {
    e.stopPropagation();
    showPanel(item);
  });

  grid.appendChild(card);
});

const overlay = document.getElementById('overlay');
const infoPanel = document.getElementById('infoPanel');
const panelEmoji = document.getElementById('panelEmoji');
const panelImg = document.getElementById('panelImg');
const panelRu = document.getElementById('panelRu');
const panelEn = document.getElementById('panelEn');
const panelTrans = document.getElementById('panelTrans');
let activeCard = null;

function showPanel(item) {
  if (activeCard) activeCard.classList.remove('active');
  activeCard = document.querySelector(`.card[data-index="${item.id}"]`);
  if (activeCard) activeCard.classList.add('active');

  panelEmoji.textContent = item.emoji;
  panelImg.src = item.img;
  panelImg.onerror = function() { this.style.display = 'none'; };
  panelRu.textContent = item.ru;
  panelEn.textContent = item.en;
  panelTrans.textContent = item.trans;

  overlay.classList.add('visible');
  infoPanel.style.display = 'block';
}

function hidePanel() {
  overlay.classList.remove('visible');
  infoPanel.style.display = 'none';
  if (activeCard) {
    activeCard.classList.remove('active');
    activeCard = null;
  }
}

overlay.addEventListener('click', hidePanel);

document.addEventListener('click', function(e) {
  if (!e.target.closest('.card') && !e.target.closest('.info-panel')) {
    hidePanel();
  }
});

document.addEventListener('touchstart', function(e) {
  if (!e.target.closest('.card') && !e.target.closest('.info-panel')) {
    hidePanel();
  }
}, { passive: true });

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') hidePanel();
});
</script>
</body>
</html>
