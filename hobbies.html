<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои увлечения — My Hobbies</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
    background: linear-gradient(135deg, #e8f5e9 0%, #e3f2fd 50%, #fff8e1 100%);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* === DECORATIVE ELEMENTS === */
  .decoration { position: fixed; pointer-events: none; z-index: 0; opacity: 0.15; }

  .leaf {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    animation: floatLeaf 8s ease-in-out infinite;
  }

  .drop {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    animation: floatDrop 6s ease-in-out infinite;
  }

  @keyframes floatLeaf {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-15px) rotate(10deg); }
    50% { transform: translateY(-5px) rotate(-5deg); }
    75% { transform: translateY(-20px) rotate(8deg); }
  }

  @keyframes floatDrop {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-12px) scale(1.1); }
  }
/* === BACK BUTTON === */
  .back-button {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    background: linear-gradient(135deg, #ffc107, #ff9800);
    color: #fff;
    text-decoration: none;
    border-radius: 30px;
    font-weight: 700;
    font-size: 1rem;
    box-shadow: 0 4px 15px rgba(255,152,0,0.4);
    transition: all 0.3s ease;
    border: 3px solid #fff;
  }

  .back-button:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 6px 20px rgba(255,152,0,0.5);
  }

  .back-button:active {
    transform: scale(0.98);
  }

  .back-button .arrow {
    font-size: 1.3rem;
    transition: transform 0.3s ease;
  }

  .back-button:hover .arrow {
    transform: translateX(-3px);
  }
  /* === HEADER === */
  .header {
    text-align: center;
    padding: 30px 20px 20px;
    position: relative;
    z-index: 1;
  }

  .header h1 {
    font-size: clamp(1.6rem, 4vw, 2.8rem);
    color: #2e7d32;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    margin-bottom: 8px;
  }

  .header .subtitle {
    font-size: clamp(1rem, 2.5vw, 1.5rem);
    color: #1565c0;
    font-weight: 600;
  }

  .header .hint {
    margin-top: 12px;
    font-size: clamp(0.8rem, 2vw, 1.1rem);
    color: #666;
    background: rgba(255,255,255,0.7);
    display: inline-block;
    padding: 8px 20px;
    border-radius: 20px;
    border: 2px dashed #a5d6a7;
  }

  /* === GRID === */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 24px;
    padding: 20px 30px 40px;
    max-width: 1400px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* === CARD === */
  .card {
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    position: relative;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .card:hover {
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 12px 30px rgba(0,0,0,0.18);
  }

  .card:active {
    transform: scale(0.97);
  }

  .card.active {
    box-shadow: 0 8px 25px rgba(46,125,50,0.35);
    border: 3px solid #4caf50;
  }

  .card-img-wrapper {
    width: 100%;
    aspect-ratio: 4/3;
    overflow: hidden;
    background: #f5f5f5;
    position: relative;
  }

  .card-img-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }

  .card:hover .card-img-wrapper img {
    transform: scale(1.05);
  }

  .card-russian {
    padding: 12px 16px;
    text-align: center;
    font-size: clamp(0.95rem, 2vw, 1.15rem);
    font-weight: 700;
    color: #333;
    background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
    border-top: 2px solid #c8e6c9;
  }

  .card-number {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #4caf50, #2e7d32);
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 0.9rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    z-index: 2;
  }

  /* === INFO PANEL === */
  .info-panel-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    animation: fadeIn 0.3s ease;
  }

  .info-panel-overlay.visible {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .info-panel {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 95%;
    max-width: 500px;
    background: linear-gradient(135deg, #ffffff, #f1f8e9);
    border-radius: 24px 24px 0 0;
    padding: 30px 24px 36px;
    z-index: 101;
    box-shadow: 0 -8px 40px rgba(0,0,0,0.25);
    animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    text-align: center;
  }

  @keyframes slideUp {
    from { transform: translateX(-50%) translateY(100%); }
    to { transform: translateX(-50%) translateY(0); }
  }

  .info-panel .close-hint {
    font-size: 0.85rem;
    color: #999;
    margin-top: 16px;
  }

  .info-panel .close-hint span {
    display: inline-block;
    width: 28px;
    height: 28px;
    background: #e0e0e0;
    border-radius: 50%;
    line-height: 28px;
    font-weight: bold;
    color: #666;
  }

  .info-panel .img-preview {
    width: 120px;
    height: 90px;
    object-fit: cover;
    border-radius: 12px;
    margin: 0 auto 16px;
    display: block;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
  }

  .info-panel .ru-text {
    font-size: 1.3rem;
    font-weight: 700;
    color: #333;
    margin-bottom: 10px;
  }

  .info-panel .arrow {
    font-size: 1.5rem;
    color: #4caf50;
    margin-bottom: 8px;
  }

  .info-panel .en-text {
    font-size: 1.6rem;
    font-weight: 800;
    color: #1565c0;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }

  .info-panel .transcription {
    font-size: 1.15rem;
    color: #6a1b9a;
    font-weight: 600;
    background: #f3e5f5;
    display: inline-block;
    padding: 6px 18px;
    border-radius: 14px;
    margin-top: 4px;
  }

  .info-panel .emoji-badge {
    font-size: 2rem;
    margin-bottom: 8px;
  }

  /* === RESPONSIVE === */
  @media (max-width: 768px) {
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      padding: 16px;
    }
    .header { padding: 20px 16px 12px; }
    .info-panel { padding: 24px 20px 30px; }
  }

  @media (max-width: 480px) {
    .grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 12px;
    }
    .card-russian { padding: 8px 10px; font-size: 0.85rem; }
    .card-number { width: 26px; height: 26px; font-size: 0.75rem; }
  }

  /* === PLACEHOLDER SVG IMAGES === */
  .placeholder-img {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.5rem;
    background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
  }

  /* === COLOR THEMES FOR CARDS === */
  .card[data-theme="green"] .card-russian { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); border-top-color: #a5d6a7; }
  .card[data-theme="blue"] .card-russian { background: linear-gradient(135deg, #e3f2fd, #bbdefb); border-top-color: #90caf9; }
  .card[data-theme="yellow"] .card-russian { background: linear-gradient(135deg, #fff8e1, #ffecb3); border-top-color: #ffe082; }
  .card[data-theme="pink"] .card-russian { background: linear-gradient(135deg, #fce4ec, #f8bbd0); border-top-color: #f48fb1; }
  .card[data-theme="purple"] .card-russian { background: linear-gradient(135deg, #f3e5f5, #e1bee7); border-top-color: #ce93d8; }
  .card[data-theme="orange"] .card-russian { background: linear-gradient(135deg, #fff3e0, #ffe0b2); border-top-color: #ffcc80; }

  /* === WATER DROP & LEAF ICONS === */
  .icon-leaf {
    display: inline-block;
    margin-right: 4px;
  }

  /* === PULSE ANIMATION FOR ACTIVE === */
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(76,175,80,0.4); }
    70% { box-shadow: 0 0 0 12px rgba(76,175,80,0); }
    100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); }
  }

  .card.active { animation: pulse 1.5s infinite; }
</style>
</head>
<body>
<a href="index.html" class="back-button">
  <span class="arrow">←</span>
  <span>В главное меню</span>
</a>
<!-- DECORATIVE LEAVES AND DROPS -->
<div class="leaf" style="top:5%;left:3%;font-size:2rem;animation-delay:0s;"></div>
<div class="leaf" style="top:15%;right:5%;font-size:1.5rem;animation-delay:1s;"></div>
<div class="drop" style="top:30%;left:8%;font-size:1.2rem;animation-delay:0.5s;">💧</div>
<div class="leaf" style="top:50%;right:3%;font-size:2rem;animation-delay:2s;">🍀</div>
<div class="drop" style="top:70%;left:5%;font-size:1rem;animation-delay:1.5s;">💧</div>
<div class="leaf" style="top:80%;right:8%;font-size:1.5rem;animation-delay:0.8s;">🌱</div>
<div class="drop" style="top:45%;left:2%;font-size:1.3rem;animation-delay:2.5s;">💧</div>
<div class="leaf" style="top:60%;left:95%;font-size:1.8rem;animation-delay:1.2s;">🍃</div>
<div class="drop" style="top:90%;left:50%;font-size:1rem;animation-delay:0.3s;">💧</div>
<div class="leaf" style="top:10%;left:50%;font-size:1.6rem;animation-delay:3s;">🌿</div>

<!-- HEADER -->
<div class="header">
  <h1> Мои увлечения — My Hobbies </h1>
  <div class="subtitle">Учим английские словосочетания! 🇬🇧</div>
  <div class="hint">👆 Нажми на карточку, чтобы узнать перевод!</div>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- INFO PANEL OVERLAY -->
<div class="info-panel-overlay" id="overlay"></div>
<div class="info-panel" id="infoPanel" style="display:none;">
  <div class="emoji-badge" id="panelEmoji"></div>
  <img class="img-preview" id="panelImg" src="" alt="">
  <div class="ru-text" id="panelRu"></div>
  <div class="arrow">⬇️</div>
  <div class="en-text" id="panelEn"></div>
  <div class="transcription" id="panelTrans"></div>
  <div class="close-hint">Нажми на пустое место, чтобы закрыть <span>✕</span></div>
</div>

<script>
// === DATA ===
const hobbies = [
  {
    id: 0,
    ru: "Я люблю математику",
    en: "I like math",
    trans: "[ай лайк мэс]",
    emoji: "🔢",
    theme: "green",
    img: "img1.png"
  },
  {
    id: 1,
    ru: "Я люблю читать книги",
    en: "I like reading books",
    trans: "[ай лайк ри́динг букс]",
    emoji: "",
    theme: "blue",
    img: "img2.png"
  },
  {
    id: 2,
    ru: "Я люблю рисовать",
    en: "I like drawing",
    trans: "[ай лайк дро́инг]",
    emoji: "🎨",
    theme: "yellow",
    img: "img3.png"
  },
  {
    id: 3,
    ru: "Я люблю слушать музыку",
    en: "I like listening to music",
    trans: "[ай лайк ли́сенинг ту мью́зик]",
    emoji: "🎧",
    theme: "pink",
    img: "img4.png"
  },
  {
    id: 4,
    ru: "Я люблю петь",
    en: "I like singing",
    trans: "[ай лайк си́нги́нг]",
    emoji: "🎤",
    theme: "purple",
    img: "img5.png"
  },
  {
    id: 5,
    ru: "Я люблю гулять в парке",
    en: "I like walking in the park",
    trans: "[ай лайк во́кинг ин зе па́рк]",
    emoji: "🌳",
    theme: "green",
    img: "img6.png"
  },
  {
    id: 6,
    ru: "Я люблю играть с котиком",
    en: "I like playing with a cat",
    trans: "[ай лайк плейинг уиз э кэт]",
    emoji: "🐱",
    theme: "orange",
    img: "img7.png"
  },
  {
    id: 7,
    ru: "Я люблю летать на самолёте",
    en: "I like flying in a plane",
    trans: "[ай лайк фла́йинг ин э плэйн]",
    emoji: "✈️",
    theme: "blue",
    img: "img8.jpg"
  },
  {
    id: 8,
    ru: "Я люблю плавать в озере",
    en: "I like swimming in the lake",
    trans: "[ай лайк сви́минг ин зе лэйк]",
    emoji: "🏊",
    theme: "blue",
    img: "img9.png"
  },
  {
    id: 9,
    ru: "Я люблю собирать грибы",
    en: "I like picking mushrooms",
    trans: "[ай лайк пи́кинг машрумз]",
    emoji: "",
    theme: "green",
    img: "img10.png"
  },
  {
    id: 10,
    ru: "Я люблю играть в шахматы",
    en: "I like playing chess",
    trans: "[ай лайк плейинг чэс]",
    emoji: "♟️",
    theme: "yellow",
    img: "img11.png"
  },
  {
    id: 11,
    ru: "Я люблю танцевать",
    en: "I like dancing",
    trans: "[ай лайк да́нсинг]",
    emoji: "💃",
    theme: "pink",
    img: "img12.png"
  }
];

// === BUILD CARDS ===
const grid = document.getElementById('grid');

hobbies.forEach((h, index) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.theme = h.theme;
  card.dataset.index = index;

  card.innerHTML = `
    <div class="card-number">${index + 1}</div>
    <div class="card-img-wrapper">
      <img src="${h.img}" alt="${h.ru}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
      <div class="placeholder-img" style="display:none;">${h.emoji}</div>
    </div>
    <div class="card-russian">${h.ru}</div>
  `;

  card.addEventListener('click', function(e) {
    e.stopPropagation();
    showPanel(h);
  });

  grid.appendChild(card);
});

// === INFO PANEL LOGIC ===
const overlay = document.getElementById('overlay');
const infoPanel = document.getElementById('infoPanel');
const panelEmoji = document.getElementById('panelEmoji');
const panelImg = document.getElementById('panelImg');
const panelRu = document.getElementById('panelRu');
const panelEn = document.getElementById('panelEn');
const panelTrans = document.getElementById('panelTrans');
let activeCard = null;

function showPanel(hobby) {
  // Remove previous active
  if (activeCard) activeCard.classList.remove('active');

  // Set active
  activeCard = document.querySelector(`.card[data-index="${hobby.id}"]`);
  if (activeCard) activeCard.classList.add('active');

  // Fill panel
  panelEmoji.textContent = hobby.emoji;
  panelImg.src = hobby.img;
  panelImg.onerror = function() { this.style.display = 'none'; };
  panelRu.textContent = hobby.ru;
  panelEn.textContent = hobby.en;
  panelTrans.textContent = hobby.trans;

  // Show
  overlay.classList.add('visible');
  infoPanel.style.display = 'block';
}

function hidePanel() {
  overlay.classList.remove('visible');
  infoPanel.style.display = 'none';
  if (activeCard) {
    activeCard.classList.remove('active');
    activeCard = null;
  }
}

// Click on overlay to close
overlay.addEventListener('click', hidePanel);

// Click anywhere else (on body/grid) to close
document.addEventListener('click', function(e) {
  if (!e.target.closest('.card') && !e.target.closest('.info-panel')) {
    hidePanel();
  }
});

// Touch support
document.addEventListener('touchstart', function(e) {
  if (!e.target.closest('.card') && !e.target.closest('.info-panel')) {
    hidePanel();
  }
}, { passive: true });

// ESC key to close
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') hidePanel();
});
</script>
</body>
</html>
